# CodeQL tuning for LitSieve.
#
# Every exclusion below is a verified false positive with the evidence noted.
# Do NOT add a rule here to silence a finding you have not traced to source.
# If a query is right, fix the code — see the two real findings fixed in
# 43b1f52 (delete_library path sanitising, sanitize_plain ReDoS pre-cap).

name: "LitSieve CodeQL config"

paths-ignore:
  # Test code is not production attack surface. The two alerts here are a
  # deliberately-lax tag regex in a security-header assertion and a substring
  # check in a citation test — both are the thing under test, not a defect.
  - tests

query-filters:
  # py/stack-trace-exposure is deliberately NOT excluded. It used to fire 31
  # times on `return server_error(e)`; server_error() now takes no argument
  # (logger.exception() captures the live exception itself), so the dataflow
  # edge is gone at source and the query stays active to catch a real leak.

  # py/cookie-injection (1 alert, app/routes/admin.py)
  # False positive: the cookie value is view["ui_mode"], guarded on the line
  # above by `if view["ui_mode"] in ("simple", "advanced")`. CodeQL does not
  # track the membership allowlist.
  - exclude:
      id: py/cookie-injection

  # py/path-injection (app/storage/libraries.py)
  # False positive as of 43b1f52: both sites now route the id through
  # _safe_fs_id(), which rejects anything but a single safe path segment.
  # CodeQL does not recognise validating sanitisers (those that raise rather
  # than transform), so the taint edge survives the guard.
  - exclude:
      id: py/path-injection

  # py/polynomial-redos (app/storage/helpdesk.py)
  # False positive as of 43b1f52: sanitize_plain() now caps its input at
  # 4x the output limit before the regex runs. Measured 8.39s -> <0.01s on
  # 200k unclosed '<'. Pinned by a sabotage-verified test. CodeQL cannot
  # reason about the slice bound.
  - exclude:
      id: py/polynomial-redos
