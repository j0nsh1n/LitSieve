name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install Python deps
        run: |
          # setuptools is not a declared dependency (Python >=3.12 venvs don't
          # ship it) but tooling can still pull it in, and pip-audit below
          # audits the whole environment. Keep it current so the blocking audit
          # never fails on something requirements.txt cannot fix.
          python -m pip install --upgrade pip setuptools
          # CPU torch first (same pattern as Dockerfile / Render).
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest ruff pyright pip-audit

      - name: Ruff
        run: ruff check .

      - name: Pyright
        # Template requires pyright. Full strict pass is still a backlog
        # (61 errors / 6 warnings under app/); report without blocking green CI
        # until cleaned.
        run: pyright app
        continue-on-error: true

      - name: Dependency audit (pip-audit)
        # Replaces the CVE-watching half of Dependabot, which was removed
        # because of its weekly version-bump PR noise. This only speaks up for
        # *known vulnerabilities* and never opens PRs.
        #
        # Audits the installed environment (not just requirements.txt) so
        # transitive and build-time packages are covered too.
        #
        # BLOCKING. A failure here means a dependency has a published CVE; fix
        # it by raising the floor in requirements.txt, or — if the package is
        # undeclared (setuptools, pip) — by bumping it in the install step
        # above. Do not silence this by re-adding continue-on-error.
        #
        # Note: torch/triton come from the PyTorch index and are reported as
        # "not found on PyPI, could not be audited". Skips do NOT fail the run
        # (that would need --strict), so this stays green — but it also means
        # torch CVEs are not covered here and remain a manual check.
        run: pip-audit --progress-spinner=off

      - name: Pytest
        env:
          SECRET_KEY: ci-test-key
          DEBUG: "true"
          CI: "true"
        run: pytest -q

      # Markdown: template always runs; never blocks.
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"
        continue-on-error: true

  docker:
    # Builds the production image and boots it. Catch broken Dockerfile / missing
    # templates before deploy. Retries Docker Hub metadata timeouts.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build image
        run: |
          for attempt in 1 2 3; do
            if docker build -t litsieve:ci .; then
              exit 0
            fi
            echo "docker build attempt ${attempt} failed; retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: Boot the container and check /health
        run: |
          docker run -d --name litsieve-ci -p 7860:7860 \
            -e SECRET_KEY=ci-smoke-key \
            litsieve:ci
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:7860/health || true)
            if [ "$code" = "200" ]; then echo "healthy after ${i}s"; break; fi
            sleep 1
          done
          test "$code" = "200" || { echo "::error::container did not become healthy"; docker logs litsieve-ci; exit 1; }
          curl -sf http://127.0.0.1:7860/health | grep -q '"status":"healthy"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7860/)" = "200"

      - name: Container logs on failure
        if: failure()
        run: docker logs litsieve-ci || true

      - name: Clean up
        if: always()
        run: docker rm -f litsieve-ci || true
