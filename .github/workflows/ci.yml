name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Same declared set as Docker/Render (CPU torch first keeps the install smaller).
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Ruff (critical + unused imports + import order)
        run: ruff check .

      - name: Run tests
        env:
          SECRET_KEY: ci-test-key
          DEBUG: "true"
        run: python -m pytest -q

  docker:
    # Builds the image and boots it. The test job installs packages directly,
    # so it cannot catch a broken Dockerfile (wrong base image, bad WORKDIR,
    # a missing runtime dependency) — that used to surface only at deploy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build image
        # Retry: GitHub runners occasionally hit Docker Hub i/o timeouts on
        # "load metadata for python:*-slim" (seen on pull_request only).
        run: |
          for attempt in 1 2 3; do
            if docker build -t literature-aide:ci .; then
              exit 0
            fi
            echo "docker build attempt ${attempt} failed; retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: Boot the container and check /health
        run: |
          docker run -d --name lra-ci -p 7860:7860 \
            -e SECRET_KEY=ci-smoke-key \
            literature-aide:ci
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:7860/health || true)
            if [ "$code" = "200" ]; then echo "healthy after ${i}s"; break; fi
            sleep 1
          done
          test "$code" = "200" || { echo "::error::container did not become healthy"; docker logs lra-ci; exit 1; }
          curl -sf http://127.0.0.1:7860/health | grep -q '"status":"healthy"'
          # Public landing must render (catches missing templates/ in the image).
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7860/)" = "200"

      - name: Container logs on failure
        if: failure()
        run: docker logs lra-ci || true

      - name: Clean up
        if: always()
        run: docker rm -f lra-ci || true
