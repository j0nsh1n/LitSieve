# Cloudflare Tunnel — recommended on CGNAT / no inbound ports (e.g. T-Mobile).
#
# Prefer the dashboard token install, or:
#   cloudflared tunnel login
#   cloudflared tunnel create litpilot
#   cp deploy/cloudflared-config.example.yml ~/.cloudflared/config.yml
#   # set tunnel id + credentials-file
#   cloudflared tunnel run litpilot
#
# In Zero Trust → Tunnels → Public Hostname:
#   hostname: YOUR_DOMAIN
#   service:  http://127.0.0.1:7860
#
# App .env: DEBUG=false, PUBLIC_BASE_URL=https://YOUR_DOMAIN

tunnel: <TUNNEL_ID>
credentials-file: /home/YOU/.cloudflared/<TUNNEL_ID>.json

ingress:
  - hostname: YOUR_DOMAIN
    service: http://127.0.0.1:7860
    originRequest:
      connectTimeout: 30s
      noHappyEyeballs: true
  - service: http_status:404
