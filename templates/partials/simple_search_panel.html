{# Phase 6 Simple only: sticky export / report panel (Advanced: CSS-hidden). #}
<aside class="search-simple-panel" id="search-simple-panel" hidden>
 <h2 class="search-simple-panel-title">Save your work</h2>
 <p class="help-text search-simple-panel-lead">Export the results on this page, or download the
  screening counts for a hand-in.</p>
 <button type="button" class="btn btn-primary btn-block" id="simple-export-results-btn">
  Export these results
 </button>
 <a class="btn btn-secondary btn-block" id="simple-screening-report-btn"
  href="/api/screening-report?format=txt"
  download="screening_report.txt">
  Download screening report
 </a>
 <p class="help-text" id="simple-export-status" aria-live="polite"></p>
 <div class="rail-stats" id="simple-rail-stats" hidden>
  <div class="funnel-row">
   <div class="funnel-row-head">
    <span>Collected</span>
    <b id="rail-stat-fetched">—</b>
   </div>
   <div class="funnel-track funnel-track--collected" id="funnel-collected-bar"
        role="img" aria-label="Collected papers"></div>
  </div>
  <div class="funnel-row">
   <div class="funnel-row-head">
    <span>Of that total</span>
   </div>
   <div class="funnel-track funnel-track--split" id="funnel-split-bar"
        role="img" aria-label="Kept versus removed">
    <span class="funnel-seg funnel-seg--kept"></span>
    <span class="funnel-seg funnel-seg--removed"></span>
   </div>
   <ul class="funnel-legend">
    <li class="funnel-legend--kept">Kept <b id="rail-stat-kept">—</b></li>
    <li class="funnel-legend--removed">Removed <b id="rail-stat-removed">—</b></li>
   </ul>
   <p class="funnel-split" id="funnel-removed-detail">
    Duplicates <b id="rail-stat-dups">—</b>
    · Screened out <b id="rail-stat-out">—</b>
   </p>
   <button type="button" class="btn btn-secondary btn-sm btn-block" id="funnel-set-aside-btn" hidden>
    See set-aside papers
   </button>
  </div>
 </div>
</aside>
